{{ if and .Values.istio.enabled .Values.dashboardAccess.gateway.enabled }}
{{ if ne .Values.dashboard.namespace .Release.Namespace }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kubernetes-dashboard
  namespace: {{ .Values.dashboard.namespace }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: {{ .Release.Namespace }}
  to:
  - group: ""
    kind: Service
    name: kubernetes-dashboard
---
{{ end }}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: kubernetes-dashboard
  namespace: {{ .Release.Namespace }}
spec:
  host: kubernetes-dashboard.{{ .Values.dashboard.namespace }}.svc.cluster.local
  exportTo:
  - "."
  trafficPolicy:
    tls:
      mode: SIMPLE
      # The legacy dashboard uses a self-signed backend certificate.
      insecureSkipVerify: true
---
{{ end }}
{{ if .Values.dashboardAccess.adminUser.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.dashboardAccess.adminUser.name }}
  namespace: {{ .Values.dashboard.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.dashboardAccess.adminUser.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.dashboardAccess.adminUser.name }}
    namespace: {{ .Values.dashboard.namespace }}
{{ end }}
