{{ if .Values.reporting.install }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: reportingcore
  labels:
    k8s-app: reportingcore
spec:
  selector:
    matchLabels:
      k8s-app: reportingcore
  template:
    metadata:
      name: reportingcore
      labels:
        k8s-app: reportingcore
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: reportingcore
          image: {{ if .Values.proxy.enabled }}{{ .Values.proxy.url }}/{{ end }}ghcr.io/travelaps/reportingfull:latest
          env:
            - name: DS_server
              value: {{ .Values.reporting.sqlServer }}
            - name: DS_user
              value: {{ .Values.reporting.sqlUser }}
            - name: DS_password
              value: {{ .Values.reporting.sqlPassword }}
---
kind: Service
apiVersion: v1
metadata:
  name: reportingcore
  labels:
    k8s-app: reportingcore
spec:
  ports:
    - name: reporting-port
      protocol: TCP
      port: 5000
      targetPort: 5000
  selector:
    k8s-app: reportingcore
  type: ClusterIP
{{ end }}
