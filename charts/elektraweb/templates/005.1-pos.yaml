{{ if .Values.pos.install }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: pos-ng11
  labels:
    k8s-app: pos-ng11
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: pos-ng11
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/005.0-pos-endpoint.yaml") . | sha256sum }}
      name: pos-ng11
      labels:
        k8s-app: pos-ng11
    spec:
      volumes:
        - name: endpoints
          configMap:
            name: pos-endpoints
            defaultMode: 420
      containers:
        - name: pos-ng11
          image: {{ if .Values.proxy.enabled }}{{ .Values.proxy.url }}/{{ end }}{{ .Values.pos.image }}
          volumeMounts:
            - name: endpoints
              mountPath: /usr/share/nginx/html/assets/endpoints-pos-client.json
              subPath: endpoints-pos-client.json
      imagePullSecrets:
        - name: regcred
---
kind: Service
apiVersion: v1
metadata:
  name: pos-ng11
  labels:
    k8s-app: pos-ng11
spec:
  ports:
    - name: pos-port
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    k8s-app: pos-ng11
  type: ClusterIP
{{ end }}
