{{- if .Values.fileUploader.install }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: file-uploader
  labels:
    k8s-app: file-uploader
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: file-uploader
  template:
    metadata:
      name: file-uploader
      labels:
        k8s-app: file-uploader
    spec:
      {{- if .Values.fileUploader.volumes }}
      volumes:
        {{- toYaml $.Values.fileUploader.volumes | nindent 8 }}
      {{- end }}
      containers:
        - name: file-uploader
          image: {{ if .Values.proxy.enabled }}{{ .Values.proxy.url }}/{{ end }}{{ .Values.fileUploader.image }}
          env:
            - name: TRUSTED_ORIGINS
              value: {{ .Values.fileUploader.env.TRUSTED_ORIGINS | squote }}
            - name: TRUSTED_IPS
              value: {{ .Values.fileUploader.env.TRUSTED_IPS | squote }}
            - name: ALLOWED_FILETYPES
              value: {{ .Values.fileUploader.env.ALLOWED_FILETYPES | squote }}
            - name: ALTERNATE_FILE_TYPES
              value: {{ .Values.fileUploader.env.ALTERNATE_FILE_TYPES | squote }}
            - name: PORT
              value: {{ .Values.fileUploader.env.PORT | squote }}
            - name: ALLOWED_TOKENS
              value: {{ .Values.fileUploader.env.ALLOWED_TOKENS | squote }}
          {{- if .Values.fileUploader.volumes }}
          volumeMounts:
            {{- toYaml $.Values.fileUploader.volumeMounts | nindent 12 }}
          {{- end }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: regcred
      schedulerName: default-scheduler
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  name: file-uploader
  labels:
    k8s-app: file-uploader
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  selector:
    k8s-app: file-uploader
  type: ClusterIP
  sessionAffinity: None
{{ end }}
