kind: Deployment
apiVersion: apps/v1
metadata:
  name: nodejs-http
  labels:
    k8s-app: nodejs-http
spec:
  selector:
    matchLabels:
      k8s-app: nodejs-http
  template:
    metadata:
      name: nodejs-http
      labels:
        k8s-app: nodejs-http
    spec:
      containers:
        - name: nodejs-http
          image: {{ if .Values.proxy.enabled }}{{ .Values.proxy.url }}/{{ end }}{{ .Values.worker.httpimage | default "ghcr.io/travelaps/nodejs-http:latest" }}
          env:
            - name: PORT
              value: '8080'
            - name: AMQP
              value: 'amqp://guest:guest@rabbit:5672/'
            - name: HOSTS
              value: |
                {
                  "{{ .Values.worker.host }}": "hotel"
                }
      imagePullSecrets:
        - name: regcred
---
kind: Service
apiVersion: v1
metadata:
  name: nodejs-http
  labels:
    k8s-app: nodejs-http
spec:
  ports:
    - name: nodejs-port
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    k8s-app: nodejs-http
  type: ClusterIP
  sessionAffinity: None
