{{ if .Values.callcenterintegration.install }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: call-center-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: call-center-integration
  template:
    metadata:
      name: call-center-integration
      creationTimestamp: null
      labels:
        k8s-app: call-center-integration
    spec:
      containers:
        - name: call-center-integration
          image: {{ if .Values.proxy.enabled }}{{ .Values.proxy.url }}/{{ end }}{{ .Values.callcenterintegration.image }}
          env:
            - name: APIURL
              value: https://{{ .Values.worker.host }}/
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            privileged: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: regcred
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  name: call-center-integration
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  selector:
    k8s-app: call-center-integration
  type: ClusterIP
  sessionAffinity: None
{{ end }}